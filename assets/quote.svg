<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="96"
     viewBox="0 0 800 96"
     role="img"
     aria-labelledby="quote-title">
    <title id="quote-title">in silence, systems endure</title>

    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A78BFA"/>
            <stop offset="1" stop-color="#B85C5C"/>
        </linearGradient>

        <style>
            .mark { font-family: Georgia, "Times New Roman", serif; font-size: 64px; font-weight: 700; fill: url(#accent); opacity: 0.4; }
            .text { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-style: italic; fill: #6C6C6C; }

            @media (prefers-color-scheme: dark) {
                .mark { opacity: 0.55; }
                .text { fill: #D8D4DF; opacity: 0.85; }
            }
        </style>
    </defs>

    <rect x="0" y="18" width="3" height="56" rx="1.5" fill="url(#accent)"/>
    <text class="mark" x="22" y="62">&#8220;</text>
    <text class="text" x="66" y="58">in silence, systems endure</text>
</svg>

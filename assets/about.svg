<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="62"
     viewBox="0 0 800 62"
     role="img"
     aria-labelledby="about-title">
    <title id="about-title">About</title>

    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#B85C5C"/>
        </linearGradient>

        <style>
            .index { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 2px; fill: #8B5CF6; }
            .title { font-family: Georgia, "Times New Roman", serif; font-size: 25px; font-weight: 700; letter-spacing: 0.3px; fill: #8B5CF6; }
            .rule  { stroke: #8B5CF6; stroke-opacity: 0.35; stroke-width: 1; }
        </style>
    </defs>

    <text class="index" x="0" y="12">01</text>
    <text class="title" x="0" y="42">About</text>
    <rect x="0" y="51" width="42" height="2" rx="1" fill="url(#accent)"/>
    <line class="rule" x1="92" y1="34" x2="800" y2="34"/>
</svg>
